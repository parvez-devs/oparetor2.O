name: Import XEROTIC source

on:
  push:
    branches: [main]
    paths:
      - '.source_bundle/**'

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .source_bundle/chunk-00.b64.txt
            cat .source_bundle/chunk-01.b64.txt
            cat .source_bundle/chunk-02.b64.txt
            cat .source_bundle/chunk-03.b64.txt
            cat .source_bundle/chunk-04.b64.txt
            cat .source_bundle/chunk-05.b64.txt
            cat .source_bundle/chunk-06.b64.txt
            rev .source_bundle/chunk-07.rev.txt
            rev .source_bundle/chunk-08.rev.txt
            rev .source_bundle/chunk-09.rev.txt
          } | tr -d '\r\n' | base64 -d > /tmp/xerotic-source.tar.gz
          echo "59f528648add13c44b9225aad3a5e425ab084b7f028b52d863da2f977532ef96  /tmp/xerotic-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/xerotic-source.tar.gz -C .
          rm -rf .source_bundle

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Import XEROTIC UID source"
          git push origin HEAD:main
