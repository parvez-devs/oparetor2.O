name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-apk
    paths:
      - "mobile/**"
      - ".github/workflows/native-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_HOME}" > /tmp/android-local.properties

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        run: npx expo install --fix

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --clean
          cp /tmp/android-local.properties android/local.properties

      - name: Build standalone APK with embedded JavaScript
        env:
          CI: "1"
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/UIDZone-Native.apk
          ls -lh dist/UIDZone-Native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UIDZone-Standalone-APK
          path: mobile/dist/UIDZone-Native.apk
          if-no-files-found: error
          retention-days: 30
