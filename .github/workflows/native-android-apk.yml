name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-apk
      - native-standalone-fix
      - v3-cyber-minimal
    paths:
      - "mobile/**"
      - ".github/workflows/native-android-apk.yml"

concurrency:
  group: native-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_HOME}" > /tmp/android-local.properties

      - name: Install base dependencies
        run: npm install --no-audit --no-fund

      - name: Install v3 native modules
        run: npm run v3:deps

      - name: Align Expo dependencies
        run: npx expo install --fix

      - name: Generate UID 2.O launcher icons
        run: python3 scripts/generate_icon.py

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate native Android project
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --clean
          cp /tmp/android-local.properties android/local.properties

      - name: Build standalone release APK
        env:
          NODE_ENV: production
          CI: "1"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage and verify standalone APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          cp "$APK" "dist/UID-2.O-v3.0.0.apk"

          if ! unzip -l "dist/UID-2.O-v3.0.0.apk" | grep -q 'assets/index.android.bundle'; then
            echo "Standalone JS bundle is missing from APK" >&2
            exit 1
          fi

          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "dist/UID-2.O-v3.0.0.apk"
          fi

          ls -lh "dist/UID-2.O-v3.0.0.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UID-2.O-v3.0.0
          path: mobile/dist/UID-2.O-v3.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v3.0.0"
          APK="dist/UID-2.O-v3.0.0.apk"
          NOTES="/tmp/uid2-v3-release-notes.md"

          cat > "$NOTES" <<'EOF'
          # UID 2.O v3.0.0 — Cyber Minimal

          Heavy native Android upgrade focused on professional visual identity, performance, security and advanced UID workflows.

          ## Highlights

          - AMOLED Cyber Minimal visual system with animated aurora depth and cyan edge lighting
          - Lottie launch reveal and native micro-interactions
          - Spring swipe gestures, long-press quick actions and haptic feedback
          - UID Card v2 with cached images, compact/full modes, inline retry, copy feedback and native bottom sheets
          - Smart Home dashboard with filters, sort modes, debounced command search and bulk toolbar
          - Command search supports status:error, saved:true, ig:true, pass:true, @username and date:YYYY-MM-DD
          - Profile Inspector with large avatar preview, secure password reveal, social actions and workspace collection assignment
          - Secure Vault with PIN, biometrics, background lock and optional screenshot blocking
          - Encrypted password-protected backup/restore
          - Offline-aware sync indicator and automatic reconnect sync
          - Import Pro validation, duplicate warning, password detection and Import Only / Import & Fetch modes
          - Saved Workspace collections
          - AMOLED / Dark / Light / System themes
          - Custom UID 2.O adaptive + monochrome launcher icon
          - FlashList + expo-image caching for large UID lists
          - Professional offline/API/cloud error states
          - GitHub release update checker
          - API/Supabase diagnostics and safe diagnostic report copy

          Install the attached `UID-2.O-v3.0.0.apk`.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "UID 2.O v3.0.0 — Cyber Minimal"               --notes-file "$NOTES"
          fi
